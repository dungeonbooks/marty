services:
  postgres-test:
    image: postgres:16
    environment:
      - POSTGRES_USER=marty_test
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=marty_test
    # Off the default port so this can run alongside another local Postgres.
    # Override with TEST_PG_PORT=5432 to go back to the standard port.
    ports:
      - "${TEST_PG_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marty_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test_network

  redis-test:
    image: redis:7
    # Off the default port so this can run alongside another local Redis.
    # Override with TEST_REDIS_PORT=6379 to go back to the standard port.
    ports:
      - "${TEST_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test_network

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  test_network:
    driver: bridge
