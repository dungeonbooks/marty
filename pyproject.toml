[project]
name = "marty"
version = "0.4.0"
description = "AI wizard bookseller"
readme = "README.md"
authors = [{ name = "Panat Taranat", email = "panat@dungeonbooks.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.104.0",
    "hypercorn>=0.16.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "gql>=3.4.0",
    "aiohttp>=3.9.0",
    "greenlet>=3.2.3",
    "anthropic>=0.57.1",
    "redis>=6.2.0",
    "structlog>=25.4.0",
    "discord-py>=2.5.2",
    "pg8000>=1.31.4",
]

[dependency-groups]
dev = [
    "pytest-cov>=4.1.0",
    "bandit>=1.7.7",
    "colorama>=0.4.6",
    "httpx>=0.28.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.12.3",
    "ty>=0.0.1a14",
    "python-dotenv>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = [
    "tests",
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ty]

[tool.bandit]
exclude_dirs = [
    ".venv",
    "venv",
    "env",
    "__pypackages__",
    "node_modules",
    ".mypy_cache",
    ".pytest_cache",
    ".tox",
    ".eggs",
    "dist",
    "build",
    "tests",
    "alembic",
]
skips = ["B101", "B008"]
